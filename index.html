<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Rotina - Daily Flow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Meta tags para o iPhone tratar como PWA/App nativo -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rotina Diária">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-28">

    <!-- Cabeçalho -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Daily Flow</h1>
                <p id="txt-data-hoje" class="text-xs text-slate-400">Sua Rotina Diária</p>
            </div>
        </div>
        <button onclick="limparDadosConcluidos()" class="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition" title="Limpar Concluídas">
            <i class="fa-solid fa-rotate-left text-sm"></i>
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Card de Progresso do Dia -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Progresso de Hoje</p>
                    <h2 id="txt-progresso-texto" class="text-3xl font-extrabold text-emerald-400 mt-1">0 de 0</h2>
                </div>
                <span id="txt-taxa-conclusao" class="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-500/30">
                    0% concluído
                </span>
            </div>
            
            <div class="w-full bg-slate-800 h-2.5 rounded-full mt-6 overflow-hidden">
                <div id="barra-progresso" class="bg-emerald-500 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <!-- Formulário para Adicionar Hábito/Rotina -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-4">
            <h3 class="font-bold text-sm text-slate-300 flex items-center justify-between">
                <span>Nova Tarefa ou Hábito</span>
                <i class="fa-solid fa-plus-circle text-emerald-400"></i>
            </h3>
            <form id="form-tarefa" class="space-y-3">
                <div>
                    <input type="text" id="input-titulo" placeholder="Ex: Meditar 10 minutos, Estudar React..." required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="time" id="input-horario" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    <select id="input-categoria" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="Trabalho">Trabalho</option>
                        <option value="Saúde">Saúde / Bem-estar</option>
                        <option value="Estudo">Estudo / Foco</option>
                        <option value="Pessoal">Pessoal / Casa</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm">
                    <i class="fa-solid fa-plus mr-1"></i> Adicionar à Rotina
                </button>
            </form>
        </div>

        <!-- Lista de Rotinas do Dia -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="font-bold text-sm text-slate-300">Sua Rotina de Hoje</h3>
                <span id="contador-tarefas" class="text-xs text-slate-500">0 itens</span>
            </div>
            <div id="lista-tarefas" class="space-y-2.5">
                <!-- Itens injetados via JavaScript -->
            </div>
        </div>

    </main>

    <!-- Barra de Navegação Inferior (Estilo App Nativo iOS) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 py-3 px-6 z-30 max-w-md mx-auto rounded-t-3xl shadow-2xl flex justify-around items-center text-xs text-slate-400">
        <button onclick="trocarAba('rotina')" class="flex flex-col items-center text-emerald-400">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="mt-1 font-medium">Rotina</span>
        </button>
        <button onclick="trocarAba('estatisticas')" class="flex flex-col items-center hover:text-slate-200 transition">
            <i class="fa-solid fa-chart-line text-lg"></i>
            <span class="mt-1 font-medium">Resumo</span>
        </button>
    </nav>

    <!-- Script de Lógica do Aplicativo -->
    <script>
        // Data atual formatada no cabeçalho
        const options = { weekday: 'long', day: 'numeric', month: 'short' };
        document.getElementById('txt-data-hoje').innerText = new Date().toLocaleDateString('pt-BR', options);

        // Estado inicial carregado do localStorage do iPhone
        let tarefas = JSON.parse(localStorage.getItem('daily_flow_tarefas')) || [
            { id: 1, titulo: 'Beber 500ml de água ao acordar', horario: '07:00', categoria: 'Saúde', concluido: false },
            { id: 2, titulo: 'Revisar metas do dia', horario: '08:30', categoria: 'Trabalho', concluido: false },
            { id: 3, titulo: 'Treino de musculação', horario: '18:00', categoria: 'Saúde', concluido: false }
        ];

        const formTarefa = document.getElementById('form-tarefa');
        const inputTitulo = document.getElementById('input-titulo');
        const inputHorario = document.getElementById('input-horario');
        const inputCategoria = document.getElementById('input-categoria');
        const listaTarefasEl = document.getElementById('lista-tarefas');
        const contadorTarefasEl = document.getElementById('contador-tarefas');
        const txtProgressoTexto = document.getElementById('txt-progresso-texto');
        const txtTaxaConclusao = document.getElementById('txt-taxa-conclusao');
        const barraProgresso = document.getElementById('barra-progresso');

        function salvarEAtualizar() {
            localStorage.setItem('daily_flow_tarefas', JSON.stringify(tarefas));
            renderizarApp();
        }

        formTarefa.addEventListener('submit', (e) => {
            e.preventDefault();
            if(!inputTitulo.value.trim()) return;

            const novaTarefa = {
                id: Date.now(),
                titulo: inputTitulo.value.trim(),
                horario: inputHorario.value || '--:--',
                categoria: inputCategoria.value,
                concluido: false
            };

            tarefas.push(novaTarefa);
            inputTitulo.value = '';
            inputHorario.value = '';
            salvarEAtualizar();
        });

        window.alternarConcluido = function(id) {
            tarefas = tarefas.map(t => t.id === id ? { ...t, concluido: !t.concluido } : t);
            salvarEAtualizar();
        }

        window.excluirTarefa = function(id) {
            tarefas = tarefas.filter(t => t.id !== id);
            salvarEAtualizar();
        }

        window.limparDadosConcluidos = function() {
            if(confirm('Deseja redefinir todas as tarefas concluídas?')) {
                tarefas.forEach(t => t.concluido = false);
                salvarEAtualizar();
            }
        }

        function renderizarApp() {
            listaTarefasEl.innerHTML = '';
            
            if (tarefas.length === 0) {
                listaTarefasEl.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-sm">
                        <i class="fa-regular fa-face-smile text-2xl mb-2"></i>
                        <p>Nenhuma rotina cadastrada hoje.</p>
                    </div>`;
                contadorTarefasEl.innerText = '0 itens';
                txtProgressoTexto.innerText = '0 de 0';
                txtTaxaConclusao.innerText = '0% concluído';
                barraProgresso.style.width = '0%';
                return;
            }

            let concluidas = tarefas.filter(t => t.concluido).length;
            let total = tarefas.length;
            let porcentagem = Math.round((concluidas / total) * 100);

            txtProgressoTexto.innerText = `${concluidas} de ${total}`;
            txtTaxaConclusao.innerText = `${porcentagem}% concluído`;
            barraProgresso.style.width = `${porcentagem}%`;
            contadorTarefasEl.innerText = `${total} ${total === 1 ? 'item' : 'itens'}`;

            tarefas.forEach(tarefa => {
                const badgeColor = {
                    'Trabalho': 'bg-blue-500/10 text-blue-400 border-blue-500/30',
                    'Saúde': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
                    'Estudo': 'bg-purple-500/10 text-purple-400 border-purple-500/30',
                    'Pessoal': 'bg-amber-500/10 text-amber-400 border-amber-500/30'
                }[tarefa.categoria] || 'bg-slate-800 text-slate-300 border-slate-700';

                const itemHTML = `
                    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex items-center justify-between transition hover:border-slate-700">
                        <div class="flex items-center space-x-3.5 flex-1 min-w-0">
                            <button onclick="alternarConcluido(${tarefa.id})" class="w-6 h-6 rounded-full border-2 ${tarefa.concluido ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-700 hover:border-emerald-500'} flex items-center justify-center transition shrink-0">
                                ${tarefa.concluido ? '<i class="fa-solid fa-check text-xs font-bold"></i>' : ''}
                            </button>
                            <div class="min-w-0 flex-1">
                                <p class="text-sm font-medium ${tarefa.concluido ? 'line-through text-slate-500' : 'text-slate-200'} truncate">${tarefa.titulo}</p>
                                <div class="flex items-center space-x-2 mt-1">
                                    <span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${tarefa.horario}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full border ${badgeColor}">${tarefa.categoria}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="excluirTarefa(${tarefa.id})" class="text-slate-600 hover:text-rose-400 p-2 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                listaTarefasEl.innerHTML += itemHTML;
            });
        }

        window.trocarAba = function(aba) {
            if(aba === 'estatisticas') {
                let concluidas = tarefas.filter(t => t.concluido).length;
                let total = tarefas.length;
                let pct = total > 0 ? Math.round((concluidas/total)*100) : 0;
                alert(`Resumo de Hoje:\n- Total de tarefas: ${total}\n- Concluídas: ${concluidas}\n- Aproveitamento: ${pct}%`);
            }
        }

        // Primeira renderização ao abrir
        renderizarApp();
    </script>
</body>
</html>
